<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code</title>
</head>
<body>
    <ul class="language">
        <li>Now I will learn about the events in javascript</li>
    </ul>
</body>
<script>
    function addOptimalLang(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.language').appendChild(li);
    }
    // function addLanguage(langName){
    //     const li = document.createElement('li');
    //     li.innerHTML = langName;
    //     document.querySelector('.language').appendChild(li);
    // }
    addOptimalLang('krdu jaaduu');
    addOptimalLang('python');
    addOptimalLang('typeScript');

    // Edit
    const second_lang = document.querySelector("li:nth-child(2)");
    // console.log(second_lang);
    
    const new_li = document.createElement('li');
    new_li.textContent = "RUST";
    second_lang.replaceWith(new_li);

    // remove
    const lastLang = document.querySelector("li:last-child");
    lastLang.remove();
</script>
</html>
